<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ro'yxatdan O'tish</title>

<style>
body{
  font-family:'Segoe UI',sans-serif;
  background:#a0e7e5;
  margin:0;
  padding:20px;
}

.wrapper{
  width:100%;
  max-width:1300px;
  margin:auto;
  display:flex;
  flex-direction:column;
  gap:20px;
}

.form-box{
  width:30%;
  background:#ffffff;
  padding:20px 25px;
  border-radius:15px;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  margin:auto;
}

h2{
  text-align:center;
  margin-bottom:20px;
  color:#333;
}

input,select{
  width:100%;
  padding:10px 12px;
  margin:8px 0;
  border-radius:8px;
  border:1px solid #ccc;
  transition:0.3s;
}

input:focus,select:focus{
  outline:none;
  border-color:#5f6ddf;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:8px;
  font-weight:bold;
  cursor:pointer;
  background:#5f6ddf;
  color:white;
}

.list-box{
  width:100%;
  background:#ffffff;
  padding:20px;
  border-radius:18px;
  overflow-x:auto;
}

.header,.row{
  display:flex;
  min-width:900px;
}

.col{
  flex:1;
  padding:8px;
}

.row:nth-child(even){
  background:#f3f5ff;
}

.action-btn{
  padding:5px 10px;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.delete-btn{
  background:red;
}

.edit-btn{
  background:green;
}
</style>
</head>

<body>

<div class="wrapper">

<div class="form-box">
<h2>Ro'yxatdan O'tish</h2>

<input type="text" id="fullname" placeholder="F.I.Sh" oninput="onlyLetters(this)">
<input type="tel" id="telefon" placeholder="Telefon" oninput="onlyNumbers(this)">

<select id="jins">
<option value="">Jins</option>
<option>Erkak</option>
<option>Ayol</option>
</select>

<input type="date" id="tugilgan">

<select id="kun">
<option value="">Kun</option>
<option>Toq</option>
<option>Juft</option>
</select>

<select id="vaqt">
<option value="">Vaqt</option>
<option>Ertalab</option>
<option>Peshin</option>
</select>

<select id="fan">
<option value="">Fan</option>
<option>Matematika</option>
<option>Ingliz tili</option>
<option>Fizika</option>
<option>IT</option>
</select>

<button id="addBtn">Qo'shish</button>
</div>

<div class="list-box">
<div class="header">
<div class="col">F.I.Sh</div>
<div class="col">Tel</div>
<div class="col">Jins</div>
<div class="col">Yosh</div>
<div class="col">Tug‘ilgan</div>
<div class="col">Kun</div>
<div class="col">Vaqt</div>
<div class="col">Fan</div>
<div class="col">Amallar</div>
</div>

<div id="list"></div>
</div>

</div>

<script>
let editIndex=null;

function onlyNumbers(input){
  input.value=input.value.replace(/[^0-9]/g,'');
}

function onlyLetters(input){
  input.value=input.value.replace(/[^a-zA-Z\s]/g,'');
}

function yoshHisobla(date){
  const d=new Date(date);
  const now=new Date();
  let yosh=now.getFullYear()-d.getFullYear();
  if(now.getMonth()<d.getMonth() || 
    (now.getMonth()==d.getMonth() && now.getDate()<d.getDate())){
    yosh--;
  }
  return yosh;
}

function getData(){
  return JSON.parse(localStorage.getItem("students")) || [];
}

function saveData(data){
  localStorage.setItem("students",JSON.stringify(data));
}

function render(){
  const list=document.getElementById("list");
  list.innerHTML="";
  const data=getData();

  data.forEach((item,index)=>{
    const yosh=yoshHisobla(item.tugilgan);

    const div=document.createElement("div");
    div.className="row";

    div.innerHTML=`
    <div class="col">${item.fullname}</div>
    <div class="col">${item.telefon}</div>
    <div class="col">${item.jins}</div>
    <div class="col">${yosh}</div>
    <div class="col">${item.tugilgan}</div>
    <div class="col">${item.kun}</div>
    <div class="col">${item.vaqt}</div>
    <div class="col">${item.fan}</div>
    <div class="col">
      <button class="action-btn edit-btn">Edit</button>
      <button class="action-btn delete-btn">X</button>
    </div>
    `;

    div.querySelector(".delete-btn").onclick=()=>{
      data.splice(index,1);
      saveData(data);
      render();
    };

    div.querySelector(".edit-btn").onclick=()=>{
      document.getElementById("fullname").value=item.fullname;
      document.getElementById("telefon").value=item.telefon;
      document.getElementById("jins").value=item.jins;
      document.getElementById("tugilgan").value=item.tugilgan;
      document.getElementById("kun").value=item.kun;
      document.getElementById("vaqt").value=item.vaqt;
      document.getElementById("fan").value=item.fan;

      editIndex=index;
      document.getElementById("addBtn").innerText="Saqlash";
    };

    list.appendChild(div);
  });
}

document.getElementById("addBtn").onclick=function(){

const fullname=document.getElementById("fullname").value.trim();
const telefon=document.getElementById("telefon").value.trim();
const jins=document.getElementById("jins").value;
const tugilgan=document.getElementById("tugilgan").value;
const kun=document.getElementById("kun").value;
const vaqt=document.getElementById("vaqt").value;
const fan=document.getElementById("fan").value;

if(!fullname||!telefon||!jins||!tugilgan||!kun||!vaqt||!fan){
  alert("Barcha maydonlarni to'ldiring!");
  return;
}

if(!/^[a-zA-Z\s]+$/.test(fullname)){
  alert("F.I.Sh faqat harflardan iborat!");
  return;
}

if(!/^[0-9]+$/.test(telefon)){
  alert("Telefon faqat raqam!");
  return;
}

let data=getData();

const obj={fullname,telefon,jins,tugilgan,kun,vaqt,fan};

if(editIndex===null){
  data.push(obj);
}else{
  data[editIndex]=obj;
  editIndex=null;
  document.getElementById("addBtn").innerText="Qo'shish";
}

saveData(data);
render();

// tozalash
document.querySelectorAll("input,select").forEach(el=>el.value="");
};

render();
</script>

</body>
</html>
